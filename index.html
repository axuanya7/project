<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>林宇轩 | Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
      font-size: 17.6px;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      color: rgba(0, 0, 0, 0.78);
    }

    /* ── Static Gradient Background ── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(160deg, #e8dff5 0%, #dce8f5 40%, #f0e4e8 100%);
    }

    /* ── Liquid Glass ── */
    .glass {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(40px) saturate(180%) brightness(1.1);
      -webkit-backdrop-filter: blur(40px) saturate(180%) brightness(1.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.4),
        inset 0 -1px 0 rgba(255, 255, 255, 0.08);
    }

    /* ── Layout ── */
    .container {
      position: relative;
      z-index: 2;
      max-width: 1320px;
      margin: 0 auto;
      padding: 53px 26px 88px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 44px;
      padding: 0 4px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: white;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
    }

    .header-name {
      font-size: 18px;
      font-weight: 700;
      color: rgba(0, 0, 0, 0.78);
    }

    .header-sub {
      font-size: 12px;
      color: rgba(0, 0, 0, 0.4);
    }

    .header-links {
      display: flex;
      gap: 10px;
    }

    .header-links a {
      font-size: 12px;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.55);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.2s;
    }

    .header-links a:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: translateY(-1px);
    }

    /* ── Project Grid ── */
    #projectList {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    /* ── Project Cards ── */
    .project-card {
      border-radius: 18px;
      padding: 31px 35px;
      animation: cardAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      position: relative;
      padding-bottom: 60px;
    }

    .project-card:nth-child(1) { animation-delay: 0.05s; }
    .project-card:nth-child(2) { animation-delay: 0.1s; }
    .project-card:nth-child(3) { animation-delay: 0.15s; }
    .project-card:nth-child(4) { animation-delay: 0.2s; }
    .project-card:nth-child(5) { animation-delay: 0.25s; }
    .project-card:nth-child(6) { animation-delay: 0.3s; }

    /* Last card spans full width if odd count */
    .project-card:last-child:nth-child(odd) {
      grid-column: 1 / -1;
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      color: rgba(0, 0, 0, 0.78);
    }

    .card-tags {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }

    .tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(0, 0, 0, 0.5);
      letter-spacing: 0.02em;
    }

    .tag.live {
      background: rgba(52, 199, 89, 0.15);
      border-color: rgba(52, 199, 89, 0.3);
      color: #1a7d36;
    }

    .card-desc {
      font-size: 13px;
      color: rgba(0, 0, 0, 0.5);
      margin-bottom: 14px;
      line-height: 1.6;
    }

    .card-tech {
      font-size: 11px;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.4);
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      margin-bottom: 16px;
      display: inline-block;
    }

    .card-details {
      list-style: none;
      padding: 0;
      margin-bottom: 16px;
    }

    .card-details li {
      font-size: 12.5px;
      color: rgba(0, 0, 0, 0.6);
      line-height: 1.7;
      padding: 5px 0 5px 18px;
      position: relative;
    }

    .card-details li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 13px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(102, 126, 234, 0.5);
    }

    .card-details li strong {
      color: rgba(0, 0, 0, 0.78);
      font-weight: 600;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      position: absolute;
      right: 35px;
      bottom: 22px;
    }

    .card-actions a {
      font-size: 12px;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.6);
      text-decoration: none;
      padding: 6px 16px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.2s;
    }

    .card-actions a:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: translateY(-1px);
    }

    .card-actions a.primary {
      background: rgba(102, 126, 234, 0.18);
      border-color: rgba(102, 126, 234, 0.3);
      color: #4a5ab9;
      font-size: 14px;
      padding: 10px 28px;
      font-weight: 600;
    }

    .card-actions a.primary:hover {
      background: rgba(102, 126, 234, 0.28);
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      padding: 24px 0 0;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }

    /* ── Responsive ── */
    @media (max-width: 946px) {
      #projectList {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .container { padding: 28px 14px 60px; }
      .project-card { padding: 20px; }
      .header { flex-direction: column; align-items: flex-start; gap: 12px; }
      .card-header { flex-wrap: wrap; }
      .card-tags { margin-left: 0; margin-top: 4px; }
    }
  </style>
</head>
